<!DOCTYPE html>
<html layout:decorate="product/_layout"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">

<!DOCTYPE html>

<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="product/_layout">

<div layout:fragment="content">

<div class="row justify-content-center">
    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-header bg-warning fw-bold">
                ✏️ Edit Product
            </div>

            <div class="card-body">

                <form th:action="@{/products/edit}"
                      th:object="${product}"
                      method="post">

                    <input type="hidden" th:field="*{id}"/>

                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" th:field="*{name}" class="form-control">
                        <small class="text-danger" th:errors="*{name}"></small>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Price</label>
                        <input type="number" step="0.01"
                               th:field="*{price}"
                               class="form-control">
                        <small class="text-danger" th:errors="*{price}"></small>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <select th:field="*{category.id}" class="form-select">
                            <option value="">-- Select Category --</option>

                            <option th:each="c : ${categories}"
                                    th:value="${c.id}"
                                    th:text="${c.name}">
                            </option>
                        </select>
                    </div>

                    <div class="d-flex justify-content-between">

                        <a th:href="@{/products}" class="btn btn-secondary">
                            ⬅ Back
                        </a>

                        <button type="submit" class="btn btn-warning">
                            🔄 Update
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>
</div>

</div>

</html>
